<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skift adgangskode · Projektstyring</title>
    <link rel="icon" type="image/png" href="/static/images/roerbot.png">
    <link rel="stylesheet" href="/static/style.css">

    <style>
        .password-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .password-card {
            width: 100%;
            max-width: 380px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
        }

        .password-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .password-logo img {
            width: 90px;
            height: 90px;
            object-fit: contain;
        }

        .password-card h1 {
            margin: 0 0 10px;
            text-align: center;
        }

        .password-help {
            margin: 0 0 24px;
            text-align: center;
        }

        .password-field {
            margin-bottom: 18px;
        }

        .password-field label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .password-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
        }

        .password-button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .password-error {
            margin-bottom: 18px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #f8d7da;
            color: #842029;
        }
    </style>
</head>

<body>
    <div class="password-page">
        <div class="password-card">
            <div class="password-logo">
                <img
                    src="/static/images/roerbot.png"
                    alt="Rørbot"
                >
            </div>

            <h1>Vælg ny adgangskode</h1>

            <p class="password-help">
                Du skal vælge din egen adgangskode,
                før du kan fortsætte.
            </p>

            {% if error %}
            <div class="password-error">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/change-password">
                <div class="password-field">
                    <label for="current_password">
                        Nuværende adgangskode
                    </label>

                    <input
                        id="current_password"
                        name="current_password"
                        type="password"
                        autocomplete="current-password"
                        required
                        autofocus
                    >
                </div>

                <div class="password-field">
                    <label for="new_password">
                        Ny adgangskode
                    </label>

                    <input
                        id="new_password"
                        name="new_password"
                        type="password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="password-field">
                    <label for="confirm_password">
                        Gentag ny adgangskode
                    </label>

                    <input
                        id="confirm_password"
                        name="confirm_password"
                        type="password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    class="password-button"
                    type="submit"
                >
                    Gem adgangskode
                </button>
            </form>
        </div>
    </div>
</body>
</html>
